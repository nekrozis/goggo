name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A branch can be gated on demand without opening a pull request. The
  # ref chosen at dispatch time supplies the checkout and the concurrency
  # group, so a dispatch on a feature branch tests that branch.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -count=1 -race ./...
