name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  # One job cross-builds every target so the artifact set and its checksums
  # are assembled in a single place. CGO is off (cross-compilation requires
  # it anyway), -trimpath removes the build directory from the binary and
  # -buildvcs=false drops VCS stamping: the same inputs then produce the
  # same bytes, and the job proves it by building each target twice and
  # comparing the hashes. Archives are normalized (sorted members, zero
  # owner, commit-based mtimes, gzip -n) so the release files themselves
  # are reproducible too.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"

      - name: Check the tag shape
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "refusing to release from tag '$GITHUB_REF_NAME': expected vX.Y.Z[-pre]" >&2
            exit 1
          fi

      - name: Build six targets
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          COMMIT="$(git rev-parse --short=12 HEAD)"
          MTIME="$(git log -1 --format=%ct)"
          # Info-ZIP and GNU gzip normalize entry times from this epoch.
          export SOURCE_DATE_EPOCH="$MTIME"
          LDFLAGS="-s -w -X github.com/nekrozis/goggo/internal/config.Version=${VER} -X github.com/nekrozis/goggo/internal/config.BuildCommit=${COMMIT}"
          mkdir -p dist build
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            ext=""
            [ "$GOOS" = windows ] && ext=".exe"
            stage="build/goggo-${VER}-${GOOS}-${GOARCH}"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -buildvcs=false \
              -ldflags "$LDFLAGS" -o "$stage/goggo${ext}" .
            # Reproducibility proof: a second build must be byte-identical.
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -buildvcs=false \
              -ldflags "$LDFLAGS" -o "$stage/goggo${ext}.second" .
            if ! cmp -s "$stage/goggo${ext}" "$stage/goggo${ext}.second"; then
              echo "non-reproducible build for $target" >&2
              exit 1
            fi
            rm "$stage/goggo${ext}.second"
            # BSD-3 requires the notice to travel with binary redistributions.
            cp LICENSE "$stage/"
            if [ "$GOOS" = windows ]; then
              ( cd build && zip -X -q "../dist/$(basename "$stage").zip" \
                  "$(basename "$stage")/LICENSE" "$(basename "$stage")/goggo${ext}" )
            else
              tar -c --format=ustar --sort=name --owner=0 --group=0 --numeric-owner \
                  --mtime "@$MTIME" -C build "$(basename "$stage")" | gzip -n > "dist/$(basename "$stage").tar.gz"
            fi
            rm -rf "$stage"
          done
          ( cd dist && sha256sum goggo-* > sha256sums.txt )

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # The release binaries for the remaining three architectures are proven by
  # the compile gate above; here every native platform additionally RUNS the
  # same build and checks the stamped version, so "the binary works" is
  # evidence, not inference.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"

      - name: Build, run --version and help
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse --short=12 HEAD)"
          # -o writes the exact name given: Windows needs the .exe spelled out.
          exe=goggo-smoke
          [ "$RUNNER_OS" = Windows ] && exe=goggo-smoke.exe
          go build -trimpath -buildvcs=false \
            -ldflags "-X github.com/nekrozis/goggo/internal/config.BuildCommit=${COMMIT}" \
            -o "$exe" .
          "./$exe" --version | grep -F "commit ${COMMIT}"
          "./$exe" help > /dev/null

  release:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # No checkout in this job: gh cannot infer the repository from a
        # working tree, so it is named explicitly.
        #
        # The notes are the generated change list with a short standing
        # preamble in front of it, so a release page says what changed without
        # anyone curating it per tag.
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "goggo ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Run 'goggo help' for the full command list."
